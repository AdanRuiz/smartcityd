name = "smartcity-tiles"
main = "src/index.ts"
compatibility_date = "2026-09-15"

# Files in public/ (generated by `pnpm --filter tiles-worker extract`, not in git). The Worker runs first because
# the assets layer answers byte ranges with the whole file, and PMTiles readers need ranges.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
