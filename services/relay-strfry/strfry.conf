# strfry for SmartCity (services/relay-strfry/README.md). Values not listed here keep strfry's defaults.
db = "/app/strfry-db/"

dbParams {
    maxreaders = 256
    # 64 GiB of address space; disk is only used as events arrive.
    mapsize = 68719476736
    noReadAhead = false
}

events {
    # NFR-5: 64 KB per event.
    maxEventSize = 65536
    # DATA-4: 15 minutes into the future.
    rejectEventsNewerThanSeconds = 900
    # Addressable definitions (city, dataset, roles) have no age limit (DATA-12); the plugin applies RELAY-5 to
    # regular events only.
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 0
    # Behind Caddy: the client's IP for logs and limits.
    realIpHeader = "x-forwarded-for"

    auth {
        enabled = false
    }

    info {
        name = "SmartCity relay (strfry)"
        description = "Relay Nostr estándar con la política de escritura de SmartCity (docs/spec/07). Lectura libre (SPAM-2)."
        pubkey = ""
        contact = ""
        nips = ""
    }

    maxWebsocketPayloadSize = 131072
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 1000
    maxSubsPerConnection = 20

    writePolicy {
        # src/policy.ts, bundled in the image: kinds, dates, schemas, proof of work for reports, cities.
        plugin = "/app/smartcity-policy.sh"
        timeoutSeconds = 10
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }
}
