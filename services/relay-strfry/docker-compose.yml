# Relay outside Cloudflare (ARCH-1, invariant 1): strfry + Caddy with automatic TLS.
#   RELAY_DOMAIN=relay.example.org docker compose up -d --build
# The domain's DNS must point at this machine and ports 80 and 443 must be open.
services:
  strfry:
    build: .
    restart: unless-stopped
    environment:
      CITIES: ${CITIES:-*}
      POW_BITS_REPORT: ${POW_BITS_REPORT:-16}
      MAX_EVENT_AGE_DAYS: ${MAX_EVENT_AGE_DAYS:-30}
    volumes:
      - strfry-db:/app/strfry-db
    expose:
      - "7777"
    ports:
      # Only on this machine, for tests without TLS: ws://127.0.0.1:7777
      - "127.0.0.1:7777:7777"

  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${RELAY_DOMAIN:-localhost} --to strfry:7777
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - strfry

volumes:
  strfry-db:
  caddy-data:
