name = "smartcity-relay"
main = "src/index.ts"
compatibility_date = "2026-09-15"

# Single hub in v1 (docs/spec/07, Q-5). SQLite-backed so it runs on the free plan.
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# Created with `wrangler d1 create smartcity-relay`. Another deployment creates its own and changes the id.
[[d1_databases]]
binding = "DB"
database_name = "smartcity-relay"
database_id = "882fe619-7ad8-46d5-bb2a-2b556c8c3cb9"
migrations_dir = "migrations"

# Attachments (`PUT`/`GET /v1/blob`, docs/spec/07) are optional: without this binding the routes answer 404. To enable
# them, `wrangler r2 bucket create smartcity-blobs` and uncomment (and repeat under [env.b] for the second relay).
# [[r2_buckets]]
# binding = "BLOBS"
# bucket_name = "smartcity-blobs"

# Daily retention (docs/spec/07, "Retención"): expired events, and days older than RETENTION_DAYS only once archived
# (RELAY-4), and only with TRUST_ANCHORS (ADR-20). Cron Triggers are not inherited by environments either, so env.b
# repeats it.
[triggers]
crons = ["17 3 * * *"]

# docs/spec/07, "Configuración". Not implemented yet: MIRROR_FROM (phase 5). TRUST_ANCHORS: comma-separated hex pubkeys whose `roles` lists the relay follows,
# for WRITE_POLICY=roles, to ask proof of work only of keys without a role and to know which keys are archivers;
# empty until the pilot has custodians (Q-10). RETENTION_DAYS: days kept before a day may be purged, once archived
# by an archiver of TRUST_ANCHORS; while TRUST_ANCHORS is empty nothing is purged by age, only expired events (RELAY-4,
# ADR-20).
[vars]
RELAY_NAME = "SmartCity relay"
RELAY_CONTACT = ""
CITIES = "*"
WRITE_POLICY = "open"
TRUST_ANCHORS = ""
POW_BITS_REPORT = "16"
RATE_EVENTS_PER_MIN = "60"
RETENTION_DAYS = "90"
MAX_EVENT_AGE_DAYS = "30"

# Second relay of the reference deployment (REPL-1, phase 2 closing criterion): `wrangler deploy --env b`.
# Own Worker (smartcity-relay-b), hub and database, so neither depends on the other. Bindings and vars are not
# inherited between environments, so they are repeated here.
[env.b]

[env.b.triggers]
crons = ["17 3 * * *"]

[[env.b.durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[env.b.d1_databases]]
binding = "DB"
database_name = "smartcity-relay-b"
database_id = "d0f8f9fa-89c0-43ab-a95a-7719ed79bbf1"
migrations_dir = "migrations"

[env.b.vars]
RELAY_NAME = "SmartCity relay B"
RELAY_CONTACT = ""
CITIES = "*"
WRITE_POLICY = "open"
TRUST_ANCHORS = ""
POW_BITS_REPORT = "16"
RATE_EVENTS_PER_MIN = "60"
RETENTION_DAYS = "90"
MAX_EVENT_AGE_DAYS = "30"
